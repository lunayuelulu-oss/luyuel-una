<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        /* ================= 基础全局样式 ================= */
        body {
            font-family: 'Courier Prime', 'Courier New', Courier, 'Noto Sans SC', monospace;
            background-color: #000000;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            cursor: none;
            overflow-x: hidden;
        }

        * {
            cursor: none !important;
        }

        .font-en { font-family: 'Courier Prime', 'Courier New', Courier, monospace !important; }
        .font-zh { font-family: 'Courier Prime', 'Courier New', Courier, 'Noto Sans SC', monospace; }
        .font-mono { font-family: 'Courier Prime', 'Courier New', Courier, 'Noto Sans SC', monospace !important; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ================= 自定义光标 ================= */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-radius: 100%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease, backdrop-filter 0.3s ease;
            z-index: 99999;
        }
        .custom-cursor.hovered {
            width: 80px;
            height: 80px;
            background-color: transparent;
            backdrop-filter: invert(1) blur(2px) contrast(1.2);
            border-width: 1px;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .custom-cursor.dragging {
            width: 16px;
            height: 16px;
            background-color: #ffffff;
        }

        /* ================= 首页横向作品画廊 ================= */
        .gallery-item {
            transition: opacity 0.5s ease, filter 0.5s ease;
        }
        .gallery-img {
            transition: border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
            border: 3px solid transparent;
        }
        .gallery-img:hover {
            transform: scale(1.03) translateY(-4px);
        }
        .gallery-img.selected {
            border-color: #ffffff;
            filter: invert(100%);
        }

        @media (hover: hover) {
            #gallery-slider:hover .gallery-item:not(:hover) {
                opacity: 0.4;
                filter: brightness(0.8);
            }
        }

        #gallery-slider.is-viewing .gallery-item:not(.active-item) {
            opacity: 0.15;
            filter: blur(4px) grayscale(100%);
            pointer-events: none;
        }

        /* ================= 模态框通用动画 ================= */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* ================= 摄影海报网格 (Film) ================= */
        .photo-grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.25rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        .photo-item {
            position: relative;
            display: flex;
        }
        .photo-item img {
            width: 100%;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .photo-number {
            position: absolute;
            font-family: 'Courier Prime', 'Courier New', Courier, 'Noto Sans SC', monospace !important;
            font-size: 1.15rem;
            font-weight: 500;
            color: #000000;
            z-index: 10;
        }
        .photo-num-left { right: 100%; top: 0; padding-right: 0.5rem; }
        .photo-num-right { left: 100%; top: 0; padding-left: 0.5rem; }
        .photo-num-bottom-right { left: 100%; bottom: 0; padding-left: 0.5rem; }
        .photo-num-bottom-left { right: 100%; bottom: 0; padding-right: 0.5rem; }

        /* ================= 纸白色手风琴折页画册系统 ================= */
        .accordion-viewport {
            overflow: hidden;
            perspective: 2200px;
        }
        .accordion-track {
            display: flex;
            align-items: stretch;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), height 0.5s ease;
            will-change: transform;
        }
        .accordion-panel {
            position: relative;
            flex-shrink: 0;
            background-color: #f8f8f6;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.7s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
        }
        /* 美术纸张微米纤维纹理 */
        .magazine-paper-texture {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            opacity: 0.32;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paperNoise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paperNoise)' opacity='0.45'/%3E%3C/svg%3E");
        }
        /* 山谷折痕压线高光 */
        .accordion-crease-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 2px;
            z-index: 25;
            pointer-events: none;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.16), rgba(255, 255, 255, 0.75));
        }
        /* 折页动态光影渐变层 */
        .accordion-fold-shade {
            position: absolute;
            inset: 0;
            z-index: 22;
            pointer-events: none;
            transition: background 0.7s ease;
        }

        /* ================= 移动端响应式适配 ================= */
        @media (max-width: 768px) {
            * { cursor: auto !important; }
            .custom-cursor { display: none !important; }

            .photo-grid-container {
                display: flex;
                flex-direction: column;
                gap: 3rem;
            }
            .photo-item {
                width: 100%;
                margin-top: 0 !important;
                margin-bottom: 0 !important;
            }
            .photo-number {
                top: -1.8rem !important;
                left: 0 !important;
                right: auto !important;
                bottom: auto !important;
                padding: 0 !important;
                font-size: 1rem;
            }

            #modal-content-container {
                padding: 1rem !important;
                padding-top: 5rem !important;
            }
            .film-mobile-pad {
                padding: 2rem 1rem 4rem 1rem !important;
            }
        }
    </style>
</head>

                    detectedAspectRatio = Math.max(1.2, Math.min(2.1, ratio));

                    <div class="magazine-paper-texture"></div>
                    ${index > 0 ? '<div class="accordion-crease-line"></div>' : ''}
                    <div class="accordion-fold-shade"></div>
                    <span class="absolute bottom-2.5 right-3.5 text-[10px] text-gray-600/80 tracking-widest z-30 font-bold mix-blend-multiply">
                        ${String(index + 1).padStart(2, '0')}
                    </span>
                `;

                track.appendChild(panel);
            });
        }

        function updateAccordionLayout() {
            const pages = flipbookCollections[currentBookKey].pages;
            const total = pages.length;
            const stage = document.getElementById('accordion-stage');
            const track = document.getElementById('accordion-track');
            const panels = track.querySelectorAll('.accordion-panel');
            if (!panels.length) return;

            const mobile = isMobileView();
            const stageWidth = stage.clientWidth || window.innerWidth;
            const stageHeight = stage.clientHeight || window.innerHeight * 0.65;

            const maxExpandedWidth = mobile
                ? Math.min(stageWidth * 0.84, 420)
                : Math.min(stageWidth * 0.66, 880);
            const idealHeight = maxExpandedWidth / detectedAspectRatio;
            const finalHeight = Math.min(stageHeight * 0.92, Math.max(mobile ? 220 : 340, idealHeight));
            const expandedWidth = Math.min(maxExpandedWidth, finalHeight * detectedAspectRatio);

            track.style.height = `${Math.round(finalHeight)}px`;

            const collapsedWidth = mobile
                ? Math.max(36, stageWidth * 0.08)
                : Math.max(76, stageWidth * 0.07);

            let offsetToActiveCenter = 0;

            panels.forEach((panel, i) => {
                const distance = i - activeFoldIndex;
                const isExpanded = distance === 0;
                const shade = panel.querySelector('.accordion-fold-shade');
                const img = panel.querySelector('img');

                const panelWidth = isExpanded ? expandedWidth : collapsedWidth;
                panel.style.width = `${panelWidth}px`;

                if (i < activeFoldIndex) {
                    offsetToActiveCenter += panelWidth;
                } else if (i === activeFoldIndex) {
                    offsetToActiveCenter += panelWidth / 2;
                }

                if (isExpanded) {
                    panel.style.transformOrigin = 'center center';
                    panel.style.transform = 'rotateY(0deg) translateZ(18px)';
                    panel.style.filter = 'brightness(1)';
                    panel.style.zIndex = '30';
                    shade.style.background = 'linear-gradient(to right, rgba(0,0,0,0.03) 0%, rgba(255,255,255,0.18) 12%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.02) 100%)';
                    img.style.opacity = '1';
                } else {
                    const isOddFold = Math.abs(distance) % 2 === 1;
                    const foldAngle = isOddFold ? -28 : 28;
                    const depthZ = -Math.min(Math.abs(distance) * 14, 70);

                    panel.style.transformOrigin = distance < 0 ? 'right center' : 'left center';
                    panel.style.transform = `perspective(1600px) rotateY(${foldAngle}deg) translateZ(${depthZ}px)`;
                    panel.style.filter = `brightness(${Math.max(0.75, 0.96 - Math.abs(distance) * 0.05)})`;
                    panel.style.zIndex = String(20 - Math.min(Math.abs(distance), 15));

                    if (isOddFold) {
                        shade.style.background = 'linear-gradient(to right, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.08) 60%, rgba(255,255,255,0.15) 100%)';
                    } else {
                        shade.style.background = 'linear-gradient(to left, rgba(0,0,0,0.24) 0%, rgba(255,255,255,0.28) 70%, rgba(0,0,0,0.05) 100%)';
                    }
                    img.style.opacity = '0.9';
                }
            });

            const translateX = (stageWidth / 2) - offsetToActiveCenter;
            track.style.transform = `translateX(${translateX}px)`;

            const dotsContainer = document.getElementById('flipbook-dots');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('button');
                dot.className = `h-1.5 transition-all interactive-el ${i === activeFoldIndex ? 'w-6 bg-white' : 'w-2 bg-white/30 hover:bg-white/60'}`;
                dot.onclick = () => {
                    activeFoldIndex = i;
                    updateAccordionLayout();
                };
                dotsContainer.appendChild(dot);
            }
        }

        function flipNext() {
            const total = flipbookCollections[currentBookKey].pages.length;
            if (activeFoldIndex + 1 < total) {
                activeFoldIndex += 1;
                updateAccordionLayout();
            }
        }

        function flipPrev() {
            if (activeFoldIndex - 1 >= 0) {
                activeFoldIndex -= 1;
                updateAccordionLayout();
            }
        }

        // 手势与鼠标拖拽切换折页
        const accordionStage = document.getElementById('accordion-stage');
        let accordionDragStartX = 0;
        let isAccordionDragging = false;

        accordionStage.addEventListener('touchstart', (e) => {
            accordionDragStartX = e.touches[0].clientX;
        }, { passive: true });

        accordionStage.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].clientX - accordionDragStartX;
            if (Math.abs(diff) > 40) {
                if (diff < 0) flipNext();
                else flipPrev();
            }
        });

        accordionStage.addEventListener('mousedown', (e) => {
            isAccordionDragging = true;
            accordionDragStartX = e.clientX;
        });

        accordionStage.addEventListener('mouseup', (e) => {
            if (!isAccordionDragging) return;
            isAccordionDragging = false;
            const diff = e.clientX - accordionDragStartX;
            if (Math.abs(diff) > 40) {
                if (diff < 0) flipNext();
                else flipPrev();
            }
        });

        accordionStage.addEventListener('mouseleave', () => {
            isAccordionDragging = false;
        });

        // 全局键盘快捷键支持（方向键翻页 + Esc 逐层关闭弹窗）
        document.addEventListener('keydown', (e) => {
            const resumeModal = document.getElementById('resume-preview-modal');
            const flipModal = document.getElementById('flipbook-modal');
            const lightboxModal = document.getElementById('lightbox-modal');
            const detailModal = document.getElementById('detail-modal');

            if (e.key === 'Escape') {
                if (resumeModal.classList.contains('opacity-100')) {
                    closeResumeModal();
                } else if (flipModal.classList.contains('opacity-100')) {
                    closeFlipbook();
                } else if (lightboxModal.classList.contains('opacity-100')) {
                    closeLightbox();
                } else if (detailModal.classList.contains('active')) {
                    closeDetail();
                }
                return;
            }

            if (flipModal.classList.contains('opacity-100')) {
                if (e.key === 'ArrowRight') flipNext();
                else if (e.key === 'ArrowLeft') flipPrev();
            }
        });

        window.addEventListener('resize', () => {
            const flipModal = document.getElementById('flipbook-modal');
            if (flipModal.classList.contains('opacity-100')) {
                updateAccordionLayout();
            }
        });
    </script>
</body>
</html>
